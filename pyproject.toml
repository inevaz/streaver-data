[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-parser"
version = "0.1.0"
description = "Data ingestion and normalization pipeline for personal records"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
data-parser = "data_parser.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
